<!-- Fork feature: Places (photo map), see FORK_FEATURES.md -->
{{- template "base" .}}

{{- define "extra_css"}}
<link href="{{.StaticURL}}/vendor/leaflet/leaflet.css" rel="stylesheet" type="text/css"/>
<link href="{{.StaticURL}}/vendor/leaflet/MarkerCluster.css" rel="stylesheet" type="text/css"/>
<link href="{{.StaticURL}}/vendor/leaflet/MarkerCluster.Default.css" rel="stylesheet" type="text/css"/>
<style {{- if .CSPNonce}} nonce="{{.CSPNonce}}"{{- end}}>
    #places_map {
        height: 70vh;
        min-height: 360px;
        border-radius: 0.75rem;
        z-index: 0;
    }
    #places_list {
        max-height: 70vh;
        overflow-y: auto;
    }
    .place-item {
        cursor: pointer;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
    }
    .place-item:hover { background: var(--bs-gray-100); }
    .place-popup img {
        width: 200px;
        max-height: 200px;
        object-fit: contain;
        display: block;
        margin-bottom: 0.4rem;
        background: var(--bs-gray-200);
    }
    .place-popup .popup-name {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
    }
</style>
{{- end}}

{{- define "page_body"}}
{{- template "errmsg" ""}}
<div class="card shadow-sm">
    <div class="card-header bg-light">
        <h3 data-i18n="title.places" class="card-title section-title">Places</h3>
    </div>
    <div class="card-body">
        <div id="places_summary" class="text-muted fs-7 mb-4"></div>
        <div class="row g-5">
            <div class="col-lg-8">
                <div id="places_map"></div>
            </div>
            <div class="col-lg-4">
                <div class="d-flex align-items-center position-relative mb-3">
                    <i class="ki-solid ki-magnifier fs-1 position-absolute ms-6"></i>
                    <input id="places_filter" type="text" data-i18n="[placeholder]places.filter"
                        class="form-control rounded-1 ps-15" placeholder="Filter places" />
                </div>
                <div id="places_list"></div>
                {{- if not .PlaceNames}}
                <div data-i18n="places.no_names" class="text-muted fs-7 mt-3">Place names are not available on this server: photos are shown on the map only.</div>
                {{- end}}
            </div>
        </div>
    </div>
</div>
{{- end}}

{{- define "extra_js"}}
<script {{- if .CSPNonce}} nonce="{{.CSPNonce}}"{{- end}} src="{{.StaticURL}}/vendor/leaflet/leaflet.js"></script>
<script {{- if .CSPNonce}} nonce="{{.CSPNonce}}"{{- end}} src="{{.StaticURL}}/vendor/leaflet/leaflet.markercluster.js"></script>
<script type="text/javascript" {{- if .CSPNonce}} nonce="{{.CSPNonce}}"{{- end}}>
    (function () {
        const POINTS_URL = '{{.PointsURL}}';
        const TILE_URL = '{{.TileURL}}';
        const THUMB_URL = '{{.ThumbnailURL}}';
        const FILES_URL = '{{.FilesURL}}';
        const PLACE_NAMES = '{{.PlaceNames}}' === 'true';

        let places = [];
        let map;

        function attr(s) {
            return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        }

        function placeLabel(p) {
            return [p.city, p.state, p.country].filter(Boolean).join(', ');
        }

        function dirOf(p) {
            let i = p.lastIndexOf('/');
            return i <= 0 ? '/' : p.slice(0, i);
        }

        function popupHTML(vpath) {
            let name = vpath.slice(vpath.lastIndexOf('/') + 1);
            let thumb = THUMB_URL ? `<img loading="lazy" src="${THUMB_URL}?path=${encodeURIComponent(vpath)}" alt="">` : '';
            return `<div class="place-popup">${thumb}
                        <div class="popup-name" title="${attr(vpath)}">${escapeHTML(name)}</div>
                        <a href="${FILES_URL}?path=${encodeURIComponent(dirOf(vpath))}">${escapeHTML($.t('places.open_folder'))}</a>
                    </div>`;
        }

        function renderPlaces() {
            let filter = $('#places_filter').val().trim().toLowerCase();
            let html = places.filter(p => !filter || placeLabel(p).toLowerCase().includes(filter)).map(function (p, i) {
                let term = p.city || p.state || p.country;
                let q = 'place:"' + term + '"';
                return `<div class="place-item d-flex align-items-center justify-content-between" data-lat="${p.lat}" data-lon="${p.lon}">
                            <div class="me-3">
                                <div class="fw-semibold">${escapeHTML(p.city || p.state || p.country)}</div>
                                <div class="text-muted fs-8">${escapeHTML([p.state, p.country].filter(Boolean).join(', '))}</div>
                            </div>
                            <a class="btn btn-sm btn-light-primary text-nowrap" href="${FILES_URL}?path=%2F&q=${encodeURIComponent(q)}">
                                ${escapeHTML($.t('places.photo_count', { count: p.photos }))}
                            </a>
                        </div>`;
            }).join('');
            $('#places_list').html(html);
        }

        // The page content may still be hidden (while the translations load)
        // when the map is created: fit the bounds once the map has a size.
        function fitWhenSized(bounds, then) {
            map.invalidateSize();
            if (map.getSize().x == 0) {
                setTimeout(function () { fitWhenSized(bounds, then); }, 100);
                return;
            }
            map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12, animate: false });
            then();
        }

        $(document).ready(function () {
            L.Icon.Default.imagePath = '{{.StaticURL}}/vendor/leaflet/images/';
            map = L.map('places_map', { worldCopyJump: true }).setView([20, 0], 2);
            let attribution = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>';
            if (PLACE_NAMES) {
                attribution += ' &middot; ' + 'Place names: <a href="https://www.geonames.org" target="_blank" rel="noopener noreferrer">GeoNames</a>';
            }
            L.tileLayer(TILE_URL, { maxZoom: 19, attribution: attribution }).addTo(map);
            if (window.ResizeObserver) {
                new ResizeObserver(function () { map.invalidateSize(); }).observe(document.getElementById('places_map'));
            }

            axios.get(POINTS_URL, { timeout: 120000 }).then(function (resp) {
                if (!resp.data || typeof resp.data !== 'object') {
                    // Expired session: the login page was returned.
                    window.location.reload();
                    return;
                }
                let points = resp.data.points || [];
                let files = resp.data.files || [];
                places = resp.data.places || [];
                $('#places_summary').text(points.length ? $.t('places.summary', {
                    photos: points.length.toLocaleString(), places: places.length.toLocaleString()
                }) : $.t('places.empty'));
                renderPlaces();
                if (!points.length) {
                    return;
                }
                let cluster = L.markerClusterGroup({ chunkedLoading: true, showCoverageOnHover: false });
                let markers = points.map(function (pt) {
                    let m = L.marker([pt[0], pt[1]]);
                    m.bindPopup(function () { return popupHTML(files[pt[2]]); }, { minWidth: 200 });
                    return m;
                });
                // Set the view first: with chunked loading, the markers are added
                // asynchronously and a view change meanwhile would leave them
                // hidden until the next move.
                let bounds = L.latLngBounds(points.map(pt => [pt[0], pt[1]]));
                fitWhenSized(bounds, function () {
                    cluster.addLayers(markers);
                    map.addLayer(cluster);
                });
            }).catch(function (err) {
                if (err && err.response && err.response.status == 401) {
                    window.location.reload();
                    return;
                }
                showToast(0, 'general.error500');
            });

            $('#places_filter').on('input', renderPlaces);
            $('#places_list').on('click', '.place-item', function (e) {
                if ($(e.target).closest('a').length) {
                    return;
                }
                map.setView([$(this).data('lat'), $(this).data('lon')], 12);
            });
        });
    })();
</script>
{{- end}}
